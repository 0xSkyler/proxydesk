# electron-builder configuration
# App identity is intentionally centralized here so the product can be
# rebranded (name, appId, icons) without touching source code.
appId: com.proxydesk.desktop
productName: ProxyDesk SEO Tracker
copyright: Copyright (c) 2026 ProxyDesk

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

extraMetadata:
  main: dist/main/main.js

asar: true

# electron-builder auto-detects a GitHub "publish" target from package.json's
# `repository` field and, in CI, tries to look up a matching draft release —
# which requires a GH_TOKEN even when nothing is actually being published.
# This project publishes releases via its own separate GitHub Actions step
# (softprops/action-gh-release, gated on version tags), so electron-builder
# itself should never attempt to touch GitHub. `publish: never` as a config
# value (rather than the `--publish never` CLI flag) makes electron-builder
# try to load a "never" publish provider module that doesn't exist, so this
# is disabled via the CLI flag in package.json's package/package:win scripts
# instead — see the note there.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico
  artifactName: ProxyDesk-SEO-Tracker-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProxyDesk SEO Tracker
  artifactName: ProxyDesk-SEO-Tracker-Setup.${ext}

# Linux/mac targets are not required by this project (Windows-only deliverable)
# but are left buildable for local development on other platforms.
linux:
  target:
    - AppImage
  icon: build/icons

mac:
  target:
    - dmg
  icon: build/icons/icon.icns
