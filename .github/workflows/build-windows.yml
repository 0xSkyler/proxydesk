# v0.5.2 live-observer verification
name: Build Windows Installer

on:
  push:
    branches:
      - main
      - feature/google-observer-click-0.5.2
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Smoke check ProxyScrape public API
        shell: pwsh
        run: |
          $url = "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text&limit=25&timeout=4000"
          $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 20
          if ($response.StatusCode -ne 200) {
            throw "ProxyScrape API returned HTTP $($response.StatusCode)"
          }
          $body = [string]$response.Content
          if ($body -notmatch '(?m)^(?:(?:http|https|socks4|socks5)://)?[^\s:]+:\d+\s*$') {
            throw "ProxyScrape API did not return parseable proxy entries."
          }
          Write-Host "ProxyScrape API smoke check passed."

      - name: Build renderer + main
        run: npm run build

      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyDesk-v0.5.2-windows
          path: release/MultiBrowserProxySetup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MultiBrowserProxySetup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
