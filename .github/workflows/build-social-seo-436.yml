name: Build Social SEO 4.3.6 Installer

on:
  push:
    branches:
      - social-seo-4.3.6-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Social SEO source
        shell: pwsh
        run: |
          $ordered = @(
            "social-seo-build-payload\part-00.b64",
            "social-seo-build-payload\part-01.b64",
            "social-seo-build-payload\part-02.b64",
            "social-seo-build-payload\part-03.b64",
            "social-seo-build-payload\part-04.b64",
            "social-seo-build-payload\part-05.b64",
            "social-seo-build-payload\tail-00a.b64",
            "social-seo-build-payload\tail-00b.b64",
            "social-seo-build-payload\tail-01.b64",
            "social-seo-build-payload\tail-02.b64",
            "social-seo-build-payload\tail-03.b64",
            "social-seo-build-payload\tail-04.b64",
            "social-seo-build-payload\tail-05.b64",
            "social-seo-build-payload\tail-06.b64",
            "social-seo-build-payload\tail-07a0.b64",
            "social-seo-build-payload\tail-07a1.b64",
            "social-seo-build-payload\tail-07b.b64",
            "social-seo-build-payload\tail-08a.b64",
            "social-seo-build-payload\tail-08b.b64"
          )
          foreach ($f in $ordered) {
            if (-not (Test-Path $f)) { throw "Missing payload chunk: $f" }
          }
          $b64 = ($ordered | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          if ($b64.Length -ne 143828) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("social-seo-4.3.6.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "social-seo-4.3.6.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "356a3d12ffcf4bd2487fadacd1bd9ee2e415ecfd2e1019a8bdc491ee89eae227"
          Write-Host "Source ZIP SHA-256: $actual"
          if ($actual -ne $expected) { throw "Source archive integrity check failed." }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.3.6.zip" -DestinationPath buildsrc -Force
          if (-not (Test-Path "buildsrc\Social-SEO\package.json")) { throw "Social-SEO/package.json missing after extraction." }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and Chromium
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm install

      - name: Validate and build Windows installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm run package:win

      - name: Show installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe -Recurse
          $exe | Format-Table FullName,Length
          if (-not $exe) { throw "No Windows installer EXE was produced." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-SEO-4.3.6-Windows
          path: buildsrc/Social-SEO/release/*.exe
          if-no-files-found: error
          retention-days: 7
